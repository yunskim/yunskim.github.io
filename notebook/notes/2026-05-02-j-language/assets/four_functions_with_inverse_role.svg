<svg width="100%" height="auto" viewBox="0 0 680 600" role="img" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<title>네 함수의 패턴과 역함수의 역할</title>
<desc>Linear, Log, Exponential, Power 네 함수가 덧셈/곱셈 세계에서 어떤 위치를 차지하고, 역함수가 두 세계 사이를 잇는 다리 역할을 한다는 것을 보여주는 다이어그램</desc>
<style>
text {
  fill: #111;
  font-family: "Gill Sans", "Gill Sans MT", Calibri, "Noto Sans KR", "Source Han Sans KR", sans-serif;
  font-size: 13px;
}
text[opacity] {
  fill: #5f5c52;
}
rect {
  shape-rendering: geometricPrecision;
}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>

<mask id="imagine-text-gaps-9u3zkg" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="600" fill="white"/><rect x="325.6171875" y="27" width="28.765625" height="18" fill="black" rx="2"/><rect x="189.83203125" y="65" width="60.3359375" height="20" fill="black" rx="2"/><rect x="193.82421875" y="85" width="52.3515625" height="18" fill="black" rx="2"/><rect x="469.83203125" y="65" width="60.3359375" height="20" fill="black" rx="2"/><rect x="477.328125" y="85" width="45.34375" height="18" fill="black" rx="2"/><rect x="25.6171875" y="307" width="28.765625" height="18" fill="black" rx="2"/><rect x="83.88671875" y="185" width="32.2265625" height="20" fill="black" rx="2"/><rect x="74.16015625" y="205" width="51.6796875" height="18" fill="black" rx="2"/><rect x="83.88671875" y="385" width="32.2265625" height="20" fill="black" rx="2"/><rect x="77.328125" y="405" width="45.34375" height="18" fill="black" rx="2"/><rect x="236.5390625" y="180" width="46.921875" height="20" fill="black" rx="2"/><rect x="250" y="203" width="20" height="18" fill="black" rx="2"/><rect x="227.67578125" y="223" width="64.6484375" height="18" fill="black" rx="2"/><rect x="544.3203125" y="180" width="31.359375" height="20.0966796875" fill="black" rx="2"/><rect x="540.99609375" y="203" width="38.0078125" height="18" fill="black" rx="2"/><rect x="527.67578125" y="223" width="64.6484375" height="18" fill="black" rx="2"/><rect x="219.4140625" y="400" width="81.171875" height="20" fill="black" rx="2"/><rect x="239.8515625" y="423" width="40.296875" height="18" fill="black" rx="2"/><rect x="227.67578125" y="443" width="64.6484375" height="18" fill="black" rx="2"/><rect x="536.15625" y="400" width="47.6875" height="20" fill="black" rx="2"/><rect x="547.18359375" y="423" width="25.6328125" height="18" fill="black" rx="2"/><rect x="527.67578125" y="443" width="64.6484375" height="18" fill="black" rx="2"/><rect x="418.5703125" y="292" width="54.305999755859375" height="18" fill="black" rx="2"/><rect x="406.5234375" y="309" width="76.953125" height="18" fill="black" rx="2"/><rect x="297.72265625" y="517" width="84.5546875" height="20" fill="black" rx="2"/><rect x="160.2578125" y="539" width="359.484375" height="18" fill="black" rx="2"/><rect x="208.671875" y="555" width="262.65625" height="18" fill="black" rx="2"/></mask></defs>

<text x="340" y="40" text-anchor="middle" opacity="0.7">입력</text>
<text x="220" y="80" text-anchor="middle">덧셈 세계</text>
<text x="220" y="98" text-anchor="middle">x → x+1</text>
<text x="500" y="80" text-anchor="middle">곱셈 세계</text>
<text x="500" y="98" text-anchor="middle">x → 2x</text>

<text x="40" y="320" text-anchor="middle" opacity="0.7" transform="rotate(-90 40 320)">출력</text>
<text x="100" y="200" text-anchor="middle">덧셈</text>
<text x="100" y="218" text-anchor="middle">y → y+c</text>
<text x="100" y="400" text-anchor="middle">곱셈</text>
<text x="100" y="418" text-anchor="middle">y → 2y</text>

<rect x="160" y="160" width="200" height="90" rx="8" fill="#EDF3F1" stroke="#2F6F68" stroke-width="0.5"/>
<text x="260" y="190" text-anchor="middle" dominant-baseline="central" fill="#1F514C">Linear</text>
<text x="260" y="212" text-anchor="middle" dominant-baseline="central" fill="#2F6F68">cx</text>
<text x="260" y="232" text-anchor="middle" dominant-baseline="central" fill="#2F6F68">덧셈 → 덧셈</text>

<rect x="460" y="160" width="200" height="90" rx="8" fill="#F4ECE6" stroke="#8A4F3D" stroke-width="0.5"/>
<text x="560" y="190" text-anchor="middle" dominant-baseline="central" fill="#643727">Log</text>
<text x="560" y="212" text-anchor="middle" dominant-baseline="central" fill="#8A4F3D">log(x)</text>
<text x="560" y="232" text-anchor="middle" dominant-baseline="central" fill="#8A4F3D">곱셈 → 덧셈</text>

<rect x="160" y="380" width="200" height="90" rx="8" fill="#F4ECE6" stroke="#8A4F3D" stroke-width="0.5"/>
<text x="260" y="410" text-anchor="middle" dominant-baseline="central" fill="#643727">Exponential</text>
<text x="260" y="432" text-anchor="middle" dominant-baseline="central" fill="#8A4F3D">e^(cx)</text>
<text x="260" y="452" text-anchor="middle" dominant-baseline="central" fill="#8A4F3D">덧셈 → 곱셈</text>

<rect x="460" y="380" width="200" height="90" rx="8" fill="#EDF3F1" stroke="#2F6F68" stroke-width="0.5"/>
<text x="560" y="410" text-anchor="middle" dominant-baseline="central" fill="#1F514C">Power</text>
<text x="560" y="432" text-anchor="middle" dominant-baseline="central" fill="#2F6F68">x^c</text>
<text x="560" y="452" text-anchor="middle" dominant-baseline="central" fill="#2F6F68">곱셈 → 곱셈</text>

<path d="M 360 425 Q 410 320 460 215" fill="none" stroke="#8A4F3D" stroke-width="1.2" opacity="0.8" marker-end="url(#arrow)" mask="url(#imagine-text-gaps-9u3zkg)"/>
<path d="M 460 195 Q 410 300 360 405" fill="none" stroke="#8A4F3D" stroke-width="1.2" opacity="0.8" marker-end="url(#arrow)"/>

<text x="445" y="305" text-anchor="middle" fill="#643727" font-style="italic">역함수 쌍</text>
<text x="445" y="322" text-anchor="middle" fill="#643727">두 세계의 다리</text>

<line x1="360" y1="200" x2="460" y2="200" stroke="#2F6F68" stroke-width="0.8" opacity="0.4" stroke-dasharray="3 3"/>
<line x1="360" y1="425" x2="460" y2="425" stroke="#2F6F68" stroke-width="0.8" opacity="0.4" stroke-dasharray="3 3"/>

<rect x="100" y="510" width="480" height="65" rx="8" fill="#F8F7EF" stroke="#9A978B" stroke-width="0.3" opacity="0.6"/>
<text x="340" y="532" text-anchor="middle" fill="#111111">역함수의 역할</text>
<text x="340" y="552" text-anchor="middle" fill="#5F5C52">Exponential은 덧셈을 곱셈으로 보내고, Log는 곱셈을 덧셈으로 되돌린다.</text>
<text x="340" y="568" text-anchor="middle" fill="#5F5C52">이 한 쌍 덕분에 두 세계 사이를 자유롭게 오갈 수 있다.</text>
</svg>
